spring.application.name=bankapp

# MySQL Database configuration
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bankappdb}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Test@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
# The schema is owned by Flyway (db/migration). Hibernate only checks that entities match it.
# If you ever need the old behaviour for local experiments: DDL_AUTO=update (and SHOW_SQL=true to see queries).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}

# Flyway: databases created earlier by Hibernate (no history table) are adopted at version 1.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Virtual threads (Java 21)
spring.threads.virtual.enabled=true

# Actuator - Only expose safe health endpoint (restricted from info,metrics,prometheus after SAST finding)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Ollama AI
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:tinyllama}
ollama.connect-timeout-ms=5000
ollama.read-timeout-ms=120000

# Structured logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
