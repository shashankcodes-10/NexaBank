# Application
spring.application.name=bankapp

# MySQL Database configuration
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bankappdb}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:Test@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate configuration
# Flyway owns the database schema. Hibernate validates entity mappings.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Virtual threads (Java 21)
spring.threads.virtual.enabled=true

# Actuator - Kubernetes health checks
# Only expose the health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Enable Kubernetes liveness and readiness probes
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=false

# Liveness checks application state only
management.endpoint.health.group.liveness.include=livenessState

# Readiness checks application readiness state
management.endpoint.health.group.readiness.include=readinessState

# Ollama AI configuration
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:tinyllama}
ollama.connect-timeout-ms=5000
ollama.read-timeout-ms=120000

# Structured logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
