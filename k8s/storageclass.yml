# EBS CSI (gp3). Not the cluster default, so PVCs reference it explicitly.
# Retain: the EBS volume (and your MySQL data) survives if the PVC is deleted.
# Switch to Delete if you want volumes cleaned up automatically.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
