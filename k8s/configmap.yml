apiVersion: v1
kind: ConfigMap
metadata:
  name: nexabank-configmap
  namespace: nexabank-ns
data:
  MYSQL_HOST: mysql-service
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: nexabankdb
  OLLAMA_URL: http://ollama-service:11434
  OLLAMA_MODEL: qwen2.5:1.5b
  # app sits behind Envoy Gateway: trust X-Forwarded-* headers
  SERVER_FORWARD_HEADERS_STRATEGY: native
