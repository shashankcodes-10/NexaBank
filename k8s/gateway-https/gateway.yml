# HTTPS on your own domain. Used when nexabank-raw.yml points its gateway path here
# (scripts/configure.sh --domain does that and fills in the hostname below).
# Port 80 stays open: Let's Encrypt validates through it, and it redirects to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nexabank-gateway
  annotations:
    # cert-manager sees this and creates the Certificate + the nexabank-tls Secret.
    # Start with staging; switch to letsencrypt-prod once it works (DEPLOY.md section 10).
    cert-manager.io/cluster-issuer: letsencrypt-prod # configure:issuer
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: nexabank.shashankpipal.in # configure:domain
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: nexabank-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexabank-route
spec:
  hostnames:
    - nexabank.shashankpipal.in # configure:domain
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nexabank-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: nexabank-service
          port: 8080
          weight: 1
---
# Plain HTTP requests are redirected to HTTPS. (cert-manager's temporary challenge route has a
# more specific path, so certificate issuing still works.)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexabank-http-redirect
spec:
  hostnames:
    - nexabank.shashankpipal.in # configure:domain
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nexabank-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: nexabank-session
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: nexabank-route
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Cookie
      cookie:
        name: NEXABANK_AFFINITY
        ttl: 3600s
