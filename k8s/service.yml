# Headless service: gives the StatefulSet stable DNS (mysql-service resolves to the pod)
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: nexabank-ns
spec:
  selector:
    app: nexabank-db
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: nexabank-ns
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: nexabank-service
  namespace: nexabank-ns
spec:
  selector:
    app: nexabank
  ports:
    - name: http
      port: 8080
      targetPort: http
