apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: nexabank-ns
  labels:
    app: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO (EBS) volume: never run two pods at once during a rollout
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: nexabank-configmap
                  key: OLLAMA_MODEL
          lifecycle:
            postStart:
              exec:
                # pull the model once the server is up; cached on the volume afterwards
                command:
                  - /bin/sh
                  - -c
                  - |
                    (until ollama list >/dev/null 2>&1; do sleep 2; done
                     ollama pull "$OLLAMA_MODEL") >/proc/1/fd/1 2>&1 &
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          # sized for t3.medium nodes (2 vCPU / 4 GiB)
          resources:
            requests:
              cpu: "500m"
              memory: "1536Mi"
            limits:
              cpu: "1500m"
              memory: "2560Mi"
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            # Ready only after the model is pulled
            exec:
              command: ["/bin/sh", "-c", 'ollama list | grep -q "$OLLAMA_MODEL"']
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-pvc