apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexabank-hpa
  namespace: nexabank-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexabank
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
