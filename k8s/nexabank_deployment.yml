apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexabank
  namespace: nexabank-ns
  labels:
    app: nexabank
spec:
  # replicas omitted on purpose: the HPA (min 2) owns the replica count
  selector:
    matchLabels:
      app: nexabank
  template:
    metadata:
      labels:
        app: nexabank
    spec:
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for MySQL..."
              attempts=0
              until nc -z mysql-service 3306; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 60 ]; then
                  echo "MySQL connection timed out"
                  exit 1
                fi
                sleep 5
              done
              echo "MySQL is reachable!"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: nexabank
          # The image tag below is rewritten by .github/workflows/bump.yml after every
          # successful build (tag = short commit SHA). Do not edit the tag by hand.
          image: shashank971/bankapp:sha-77d8da8
          imagePullPolicy: IfNotPresent   # tags are unique per commit, so no need for Always
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nexabank-configmap
            - secretRef:
                name: nexabank-secret
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3