name: DevSecOps

permissions:
  contents: read

on:
   push:
     branch: [main]

jobs:
  secrets_scanning: 
    uses: ./.github/workflows/secrets_scan.yml

  linting:
    uses: ./.github/workflows/lint.yml

  testing:
    uses: ./.github/workflows/code_test.yml  

  sast:
    uses: ./.github/workflows/sast.yml  
    needs: [secrets_scanning,linting,testing]

  sca:
    uses: ./.github/workflows/sca.yml  
    needs: [secrets_scanning,linting,testing]
    secrets: inherit

  image-scanning:
    uses: ./.github/workflows/image_scan.yml  
    needs: [sast,sca]
    secrets: inherit

  docker-push:
    uses: ./.github/workflows/docker_push.yml   
    needs: [image-scanning]
    secrets: [inherit]


