name: Bump image in the deploy files

# Writes the freshly pushed image into BOTH deploy methods and commits it to the branch:
#   - helm/nexabank/values.yaml           (Helm mode)
#   - k8s/app/nexabank-deployment.yaml    (raw-manifest mode)
# Updating both keeps them identical, so you can switch modes at any time. ArgoCD watches the
# one you deployed, sees the commit and rolls the new image out to EKS.

on:
  workflow_call:
    inputs:
      image:
        description: Full image reference, e.g. shashank971/nexabank:sha-ab12cd3
        required: true
        type: string
      values_file:
        type: string
        default: helm/nexabank/values.yaml
      raw_file:
        type: string
        default: k8s/app/nexabank-deployment.yaml

permissions:
  contents: write

jobs:
  bump:
    name: Update values and push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # two quick pushes must not race each other on the same branch
    concurrency:
      group: bump-manifest
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0 # `git pull --rebase` below needs real history

      # values.yaml has two marker lines: "# managed by bump.yml (repository)" and "(tag)"
      - name: Update image in values file
        env:
          IMAGE: ${{ inputs.image }}
          VALUES_FILE: ${{ inputs.values_file }}
        run: |
          set -euo pipefail
          REPO="${IMAGE%:*}"
          TAG="${IMAGE##*:}"
          [ "$REPO" != "$IMAGE" ] || { echo "::error::image must look like repo:tag"; exit 1; }
          sed -i -E \
            -e "s|^([[:space:]]+repository:[[:space:]]*).*(# managed by bump.yml \(repository\))\$|\1${REPO} \2|" \
            -e "s|^([[:space:]]+tag:[[:space:]]*).*(# managed by bump.yml \(tag\))\$|\1\"${TAG}\" \2|" \
            "$VALUES_FILE"
          grep -q "repository: ${REPO} # managed by bump.yml" "$VALUES_FILE" || { echo "::error::repository line was not updated"; exit 1; }
          grep -q "tag: \"${TAG}\" # managed by bump.yml" "$VALUES_FILE" || { echo "::error::tag line was not updated"; exit 1; }
          git --no-pager diff -- "$VALUES_FILE"

      # raw mode: the image line carries "# managed by bump.yml (image)"
      - name: Update image in the raw manifest
        env:
          IMAGE: ${{ inputs.image }}
          RAW_FILE: ${{ inputs.raw_file }}
        run: |
          set -euo pipefail
          if [ ! -f "$RAW_FILE" ]; then echo "No $RAW_FILE, skipping raw mode."; exit 0; fi
          sed -i -E "s|^([[:space:]]+image:[[:space:]]*).*(# managed by bump.yml \(image\))\$|\1${IMAGE} \2|" "$RAW_FILE"
          grep -q "image: ${IMAGE} # managed by bump.yml" "$RAW_FILE" || { echo "::error::image line was not updated in $RAW_FILE"; exit 1; }
          git --no-pager diff -- "$RAW_FILE"

      - name: Commit and push
        env:
          IMAGE: ${{ inputs.image }}
          VALUES_FILE: ${{ inputs.values_file }}
          RAW_FILE: ${{ inputs.raw_file }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Values already use ${IMAGE}, nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # scoped add: never commit anything but the values file
          git add "$VALUES_FILE"
          [ ! -f "$RAW_FILE" ] || git add "$RAW_FILE"
          git commit -m "ci: deploy ${IMAGE##*:} [skip ci]"

          # another push may land meanwhile: rebase and retry
          for i in 1 2 3; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            echo "Push rejected (attempt ${i}); retrying..."
            sleep $((i * 5))
          done
          exit 1
