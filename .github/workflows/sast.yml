name: Static Application Security Testing

on:
  workflow_call:

jobs:
  sast:
   name: SAST - Semgrep
   runs-on: ubuntu-latest

   permissions:
    contents: read

   container:
    image: semgrep/semgrep

   steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run Semgrep SAST Scan
      uses: semgrep/semgrep-action@v1
      with:
        config: >-
            p/java
            p/owasp-top-ten
            p/secrets