name: Secrets Scanning

on:
  workflow_call:

jobs:
  secrets_scanning:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: git leaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}