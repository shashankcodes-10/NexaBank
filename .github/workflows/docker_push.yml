name: Docker Push

on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: linux/amd64
      image_name:
        type: string
        default: bankapp          # Docker Hub repo: <DOCKERHUB_USERNAME>/<image_name>
    secrets:
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      image:
        description: Full image reference that was pushed (user/repo:tag)
        value: ${{ jobs.docker_push.outputs.image }}
      tag:
        description: Image tag (sha-<short commit SHA>)
        value: ${{ jobs.docker_push.outputs.tag }}

permissions:
  contents: read

jobs:
  docker_push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # One unique, traceable tag per commit: the image maps back to exactly one git commit.
      - name: Compute image tag
        id: meta
        env:
          DH_USER: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "repo=${DH_USER}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=${DH_USER}/${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      # QEMU is only needed when arm64 is requested (slow, emulated build)
      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to dhi.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          PLATFORMS: ${{ inputs.platforms }}
        run: echo "Pushed ${IMAGE} (${PLATFORMS})" >> "$GITHUB_STEP_SUMMARY"