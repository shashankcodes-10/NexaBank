name: Software Composition Analysis

on:
  workflow_call:
    secrets:
      NVD_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  sca:
    name: SCA - OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Restore only. Saving is a separate step below so the NVD data is
      # cached even when the scan fails on vulnerabilities.
      - name: Restore OWASP NVD Database cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.dependency-check-data-12.2.2
          key: owasp-12.2.2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            owasp-12.2.2-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw --batch-mode --no-transfer-progress \
            org.owasp:dependency-check-maven:12.2.2:check \
            -DdataDirectory="$HOME/.dependency-check-data-12.2.2" \
            -Dformats=HTML,JSON,SARIF \
            -DfailBuildOnCVSS=7 \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DsuppressionFile=suppression.xml

      - name: Save OWASP NVD Database cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.dependency-check-data-12.2.2
          key: owasp-12.2.2-${{ runner.os }}-${{ github.run_id }}

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: owasp-dependency-check-report
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn
          retention-days: 14
