# Dependabot opens pull requests when a dependency has a newer version.
# Workflows pin actions to commit SHAs; Dependabot bumps the SHA and the "# vX" comment.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7        # security updates ignore the cooldown
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:     # one PR for all minor/patch bumps
        update-types: [minor, patch]
    ignore:
      # Spring Boot 4 is a migration project (Framework 7, Actuator/Micrometer, OTel agent);
      # stay on 3.5.x patches and move to 4.x deliberately on its own branch
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend      # base images in backend/Dockerfile
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3

  - package-ecosystem: terraform
    directories:             # one entry per root module
      - /terraform
      - /terraform/bootstrap
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      terraform-minor-patch:
        update-types: [minor, patch]