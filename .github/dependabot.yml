# Dependabot opens pull requests when a dependency has a newer version.
# Important here: our workflows pin actions to commit SHAs, and Dependabot is what
# keeps those SHAs from going stale (it bumps the SHA and the "# vX" comment).
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7      # wait 7 days before proposing brand-new releases
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7      # wait 7 days before proposing brand-new releases
    open-pull-requests-limit: 5
    groups:
      # one PR for all minor/patch bumps instead of a PR per library
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directories:               # plural: one entry per root module
      - /terraform
      - /terraform/bootstrap
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      terraform-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend        # wherever your Dockerfile lives
    schedule:
      interval: weekly
    cooldown:
      default-days: 7      