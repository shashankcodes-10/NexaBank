apiVersion: v1
kind: ConfigMap
metadata:
  name: nexabank-configmap
data:
  MYSQL_HOST: mysql-service
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: {{ .Values.app.mysqlDatabase | quote }}
  OLLAMA_URL: http://ollama-service:11434
  OLLAMA_MODEL: {{ .Values.app.ollamaModel | quote }}
  # behind Envoy Gateway: trust X-Forwarded-* headers
  SERVER_FORWARD_HEADERS_STRATEGY: native
