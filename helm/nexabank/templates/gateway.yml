{{- $tls := and .Values.gateway.hostname .Values.gateway.tls.enabled }}
# The GatewayClass "envoy" is created by scripts/deploy.sh (gitops/gateway/gatewayclass.yml).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  {{- if $tls }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.gateway.tls.clusterIssuer }}
  {{- end }}
spec:
  gatewayClassName: envoy
  listeners:
    # port 80 is also needed for the Let's Encrypt HTTP-01 challenge
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- if $tls }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gateway.hostname }}
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: nexabank-tls
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexabank-route
spec:
  {{- if .Values.gateway.hostname }}
  hostnames:
    - {{ .Values.gateway.hostname }}
  {{- end }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      sectionName: {{ if $tls }}https{{ else }}http{{ end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: nexabank-service
          port: 8080
          weight: 1
{{- if $tls }}
---
# Plain HTTP requests are redirected to HTTPS. (cert-manager's temporary challenge route
# has a more specific path, so certificate issuing still works.)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nexabank-http-redirect
spec:
  hostnames:
    - {{ .Values.gateway.hostname }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
{{- end }}
---
# Envoy Gateway ignores Service sessionAffinity. The app keeps login/CSRF state in memory,
# so pin each browser to one pod with a cookie.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: nexabank-session
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: nexabank-route
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Cookie
      cookie:
        name: NEXABANK_AFFINITY
        ttl: 3600s
