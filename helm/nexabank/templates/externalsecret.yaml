# Builds the `nexabank-secret` Secret (read by the app and by MySQL through envFrom) from
# AWS Secrets Manager via External Secrets Operator. No password is stored in Git.
# Source secret JSON: {"root_password": "...", "username": "...", "password": "..."}
# (written by scripts/set-secrets.sh)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nexabank-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: nexabank-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: Opaque
      data:
        MYSQL_ROOT_PASSWORD: {{ `"{{ .root_password }}"` }}
        MYSQL_USER: {{ `"{{ .username }}"` }}
        MYSQL_PASSWORD: {{ `"{{ .password }}"` }}
  dataFrom:
    - extract:
        key: {{ .Values.secrets.mysqlSecretName }}
