# Cluster-wide link to AWS Secrets Manager. Authentication comes from the Pod Identity
# association in terraform/pod-identity.tf (no keys). The region MUST be the cluster's region.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2   # configure:region
