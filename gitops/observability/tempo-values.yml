# Tempo: trace storage. The OpenTelemetry Collector sends traces to tempo:4317 (OTLP gRPC).
# without this the Service is named after the release and tempo.observability DNS fails
fullnameOverride: tempo

tempo:
  retention: 72h
  reportingEnabled: false
  storage:
    trace:
      backend: local
  receivers:
    # Do NOT set jaeger: null. The chart's Service template reads receivers.jaeger.protocols.*
    # and fails to render without them. The chart's jaeger defaults stay (unused, in-cluster only).
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }

persistence:
  enabled: true
  size: 10Gi
  storageClassName: gp3

serviceMonitor:
  enabled: true
