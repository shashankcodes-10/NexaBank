# OpenTelemetry Collector: receives traces from the NexaBank Java agent (OTLP/HTTP :4318)
# and forwards them to Tempo (OTLP/gRPC :4317).
mode: deployment
replicaCount: 1
fullnameOverride: otel-collector # the app's OTEL_EXPORTER_OTLP_ENDPOINT points at this name

image:
  repository: otel/opentelemetry-collector-k8s
command:
  name: otelcol-k8s

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 256Mi }

# only the OTLP ports are needed
ports:
  otlp:
    enabled: true
  otlp-http:
    enabled: true
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true # needed by the ServiceMonitor below

config:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}
  exporters:
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
  service:
    extensions: [health_check]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]
      metrics: null
      logs: null

serviceMonitor:
  enabled: true
