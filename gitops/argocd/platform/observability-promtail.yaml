# Promtail: ships container logs to Loki. DEPRECATED upstream (end of life), kept because requested; see DEPLOY.md for Grafana Alloy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-promtail
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: promtail
      targetRevision: "6.17.1"
      helm:
        releaseName: observability-promtail
        valueFiles:
          - $values/gitops/observability/promtail-values.yaml

    - repoURL: https://github.com/shashankcodes-10/NexaBank.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # resources whose CRD arrives from another Application in the same wave: retry fixes the order
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
