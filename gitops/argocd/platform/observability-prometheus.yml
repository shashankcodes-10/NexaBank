# Prometheus + Operator + Grafana + node-exporter + kube-state-metrics. cAdvisor is scraped from the kubelet.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "93.9.0"
      helm:
        releaseName: observability-prometheus
        valueFiles:
          - $values/gitops/observability/prometheus-values.yml

    - repoURL: https://github.com/shashankcodes-10/NexaBank.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # big CRDs do not fit in a client-side apply (262144-byte annotation limit)
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
