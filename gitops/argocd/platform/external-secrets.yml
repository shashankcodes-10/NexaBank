# External Secrets Operator. Wave 0: it registers the CRDs the config app (wave 1) needs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default

  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "2.8.0"
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          create: true
          # the Pod Identity association in terraform/pod-identity.tf names this ServiceAccount
          name: external-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # big CRDs do not fit in a client-side apply (262144-byte annotation limit)
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
