services:
  nexabank:
    container_name: nexabank
    build: ./backend
    ports:
      - "8080:8080"
    networks:
      - nexabank
    env_file:
      - .env
    depends_on:
      mysql:
        condition:  service_healthy
      ollama-pull-model:
        condition: service_completed_successfully
  
  mysql:
    container_name: mysql
    image: mysql:8.0
    env_file:
      - .env
    networks:
      - nexabank
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama
    container_name: nexabank-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexabank

  ollama-pull-model:
    image: ollama/ollama
    container_name: ollama-pull-model
    environment:
      - OLLAMA_HOST=ollama
    volumes:
      - ollama-data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    env_file:
      - .env
    command: -c "ollama pull $${OLLAMA_MODEL}"
    networks:
      - nexabank

volumes:
   ollama-data:
   mysql-data:     

networks:
   nexabank:
