---
# Clones the NexaBank repo into the home folder.
#
#   ansible-playbook -i inventory.ini 03-clone-repo.yml
#
# repo_url in group_vars/nexabank.yml must be a repo YOU can push to: ArgoCD deploys
# from Git, and the CI bump commits land there.

- name: Clone the NexaBank repo
  hosts: nexabank
  become: true

  tasks:
    - name: Clone the repo
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "/home/{{ login_user }}/NexaBank"
        version: "{{ repo_branch }}"
        # false so a re-run never throws away local edits
        update: false
      become: true
      become_user: "{{ login_user }}"

    - name: Set the git identity (once; kept in ~/.gitconfig)
      ansible.builtin.shell: |
        git config --global user.name  "{{ git_user_name }}"
        git config --global user.email "{{ git_user_email }}"
        git config --global pull.rebase true
        git config --global init.defaultBranch main
      become: true
      become_user: "{{ login_user }}"
      changed_when: false
      when: git_user_name | length > 0 and git_user_email | length > 0

    - name: Remind about the one thing Ansible cannot do (GitHub login)
      ansible.builtin.debug:
        msg: >-
          Cloned to /home/{{ login_user }}/NexaBank and git identity set. Run ONCE by hand:
          `gh auth login` then `gh auth setup-git` (token needs the repo and workflow scopes).
          After that, pushing from this machine never asks again.
