# Your EC2 machine.
#  - Running Ansible FROM the EC2 machine itself: keep the `localhost` line.
#  - Running Ansible from your laptop: comment `localhost` out and fill in the second line.
# Ubuntu AMIs log in as `ubuntu`.

[nexabank]
#nexabank-ec2 ansible_host=1.2.3.4 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/my-key.pem
localhost ansible_connection=local

[nexabank:vars]
ansible_python_interpreter=/usr/bin/python3
host_key_checking=False
